syntax = "proto3";

package customer;

service CustomerService {
    rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);

    rpc GetAllCustomer(GetAllCustomerRequest) returns (GetAllCustomerResponse);

    rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);

    rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

    rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse);
}


// ====================
// Customer
// ====================

message Customer {
    int32 id = 1;
    int32 user_id = 2;
    string name = 3;
    string phone_number = 4;
    string date_of_birth = 5;
    string created_at = 6;
    string updated_at = 7;
}


// ====================
// Get Customer
// ====================

message GetCustomerRequest {
    int32 id = 1;
}

message GetCustomerResponse {
    bool is_error = 1;
    string error_code = 2;
    optional string message = 3;
    optional Customer customer = 4;
}


// ====================
// Get All Customer
// ====================

message GetAllCustomerRequest {
    optional int32 page = 1;
    optional int32 limit = 2;
}

message GetAllCustomerResponse {
    bool is_error = 1;
    string error_code = 2;
    optional string message = 3;
    repeated Customer customers = 4;
    int32 total = 5;
}


// ====================
// Create Customer
// ====================

message CreateCustomerRequest {
    int32 user_id = 1;
    string name = 2;
    string phone_number = 3;
    string date_of_birth = 4;
}

message CreateCustomerResponse {
    bool is_error = 1;
    string error_code = 2;
    optional string message = 3;
    optional Customer customer = 4;
}


// ====================
// Update Customer
// ====================

message UpdateCustomerRequest {
    int32 id = 1;
    optional string name = 2;
    optional string phone_number = 3;
    optional string date_of_birth = 4;
}

message UpdateCustomerResponse {
    bool is_error = 1;
    string error_code = 2;
    optional string message = 3;
    optional Customer customer = 4;
}


// ====================
// Delete Customer
// ====================

message DeleteCustomerRequest {
    int32 id = 1;
}

message DeleteCustomerResponse {
    bool is_error = 1;
    string error_code = 2;
    optional string message = 3;
}