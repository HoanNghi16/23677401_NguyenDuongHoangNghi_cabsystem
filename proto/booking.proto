syntax = "proto3";

package booking;

service BookingService {
    rpc UpdateDriverAvailability(DriverAvailabilityRequest)
        returns (DriverAvailabilityResponse);
    rpc CreateBooking(BookingRequest) returns (BookingResponse);
    rpc GetBookings(GetBookingsRequest) returns (GetBookingsResponse);
    rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
    rpc RespondToOffer(RespondToOfferRequest) returns (RespondToOfferResponse);
}

message RespondToOfferRequest{
    string booking_id = 1;
    int32 user_id = 2;
    string respond = 3;
}


message RespondToOfferResponse{
    bool is_error = 1;
    string error_code = 2;
    optional Booking booking = 3;
    optional string message = 4;
}


message GetBookingRequest{
    int32 user_id = 1;
    string booking_id = 2;
}

message GetBookingResponse{
    bool is_error = 1;
    string error_code = 2;
    optional Booking booking = 3;
}


message GetBookingsRequest{
    int32 customer_id = 1;
    int32 page = 2;
}

message GetBookingsResponse{
    int32 page = 1;
    repeated Booking bookings = 2;
}


message BookingRequest{
    int32 user_id = 1;
    int32 customer_id = 2;
    Location pickup = 3;
    Location destination = 4;
    string vehicle_type = 5;
}


message BookingResponse{
    bool is_error = 1;  
    string error_code = 2;
    Booking booking = 3;
}

message Booking{
    string booking_id = 1;
    int32 customer_id = 2;
    optional int32 driver_id = 3;
    Location pickup = 4;
    Location destination = 5;
    double fare = 6;
    string status = 7;
}

message DriverAvailabilityRequest {
    int32 user_id = 1;
    int32 driver_id = 2;
    string vehicle_type = 3;
    string license_plate = 4;
    string status = 5;
    Location location = 6;
}

message DriverAvailabilityResponse {
    bool is_error = 1;
    string error_code = 2;
}

message Location {
    double latitude = 1;
    double longitude = 2;
}