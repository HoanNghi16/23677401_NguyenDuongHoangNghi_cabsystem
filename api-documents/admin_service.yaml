openapi: 3.0.3

info:
  title: Admin Service API
  description: |
    Admin Service cung cấp các chức năng vận hành và quản trị hệ thống GoLift.

    Service này không sở hữu dữ liệu nghiệp vụ của User, Driver, Vehicle hay Trip.
    Thay vào đó, Admin Service đóng vai trò orchestration/facade cho nhân viên vận hành,
    gọi đến User Service, Trip Service và Position Service khi cần.

    Admin Service trực tiếp quản lý:
    - Incident/Sự cố vận hành
    - Audit Log
    - Các thao tác quản trị và giám sát

    Chỉ người dùng có role OPERATOR hoặc ADMIN mới được phép truy cập.
  version: 1.0.0

servers:
  - url: http://localhost:8008
    description: Local development server

tags:
  - name: Users
    description: Quản lý khách hàng và tài khoản
  - name: Drivers
    description: Quản lý tài xế
  - name: Vehicles
    description: Quản lý phương tiện
  - name: Trips
    description: Giám sát chuyến đi
  - name: Positions
    description: Theo dõi vị trí tài xế
  - name: Incidents
    description: Xử lý sự cố
  - name: Audit
    description: Tra cứu nhật ký thao tác quản trị

paths:

  # ============================================================
  # USERS
  # ============================================================

  /admin/users:
    get:
      tags:
        - Users
      summary: Danh sách người dùng
      description: |
        Tra cứu danh sách khách hàng và người dùng trong hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}:
    get:
      tags:
        - Users
      summary: Xem thông tin người dùng
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Users
      summary: Cập nhật trạng thái tài khoản
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # DRIVERS
  # ============================================================

  /admin/drivers:
    get:
      tags:
        - Drivers
      summary: Danh sách tài xế
      description: |
        Tra cứu tài xế theo trạng thái, loại xe và từ khóa.
        Dữ liệu được lấy từ User Service.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DriverStatus'
        - name: vehicleType
          in: query
          schema:
            $ref: '#/components/schemas/VehicleType'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriverListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/drivers/{driverId}:
    get:
      tags:
        - Drivers
      summary: Xem thông tin tài xế
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Thông tin tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriver'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/drivers/{driverId}/status:
    patch:
      tags:
        - Drivers
      summary: Cập nhật trạng thái tài xế
      description: |
        Nhân viên vận hành có thể thay đổi trạng thái tài xế,
        ví dụ chuyển tài xế sang SUSPENDED khi phát hiện vi phạm.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # VEHICLES
  # ============================================================

  /admin/vehicles:
    get:
      tags:
        - Vehicles
      summary: Danh sách phương tiện
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: vehicleType
          in: query
          schema:
            $ref: '#/components/schemas/VehicleType'
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicles
      summary: Xem thông tin phương tiện
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Thông tin phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicle'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/vehicles/{vehicleId}/status:
    patch:
      tags:
        - Vehicles
      summary: Cập nhật trạng thái phương tiện
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # TRIPS
  # ============================================================

  /admin/trips:
    get:
      tags:
        - Trips
      summary: Tra cứu chuyến đi
      description: |
        Cho phép nhân viên vận hành giám sát và tra cứu lịch sử chuyến.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TripStatus'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: driverId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTripListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips/{tripId}:
    get:
      tags:
        - Trips
      summary: Xem chi tiết chuyến
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Chi tiết chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrip'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # POSITIONS
  # ============================================================

  /admin/drivers/{driverId}/position:
    get:
      tags:
        - Positions
      summary: Xem vị trí hiện tại của tài xế
      description: |
        Admin Service lấy dữ liệu vị trí từ Position Service
        để phục vụ giám sát vận hành.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Vị trí hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPosition'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # INCIDENTS
  # ============================================================

  /admin/incidents:
    get:
      tags:
        - Incidents
      summary: Danh sách sự cố
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/IncidentSeverity'
        - name: tripId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách sự cố
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Incidents
      summary: Tạo báo cáo sự cố
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Tạo sự cố thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/incidents/{incidentId}:
    get:
      tags:
        - Incidents
      summary: Xem chi tiết sự cố
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Chi tiết sự cố
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Incidents
      summary: Cập nhật và xử lý sự cố
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # AUDIT LOG
  # ============================================================

  /admin/audit-logs:
    get:
      tags:
        - Audit
      summary: Tra cứu nhật ký thao tác quản trị
      description: |
        Ghi nhận và tra cứu các thao tác quản trị quan trọng
        được thực hiện bởi OPERATOR hoặc ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Danh sách audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  # ============================================================
  # SECURITY
  # ============================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ============================================================
  # RESPONSES
  # ============================================================

  responses:

    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:

    # ----------------------------------------------------------
    # ENUMS
    # ----------------------------------------------------------

    UserRole:
      type: string
      enum:
        - CUSTOMER
        - DRIVER
        - OPERATOR
        - ADMIN

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED

    DriverStatus:
      type: string
      enum:
        - OFFLINE
        - AVAILABLE
        - BUSY
        - SUSPENDED

    VehicleType:
      type: string
      enum:
        - MOTORBIKE
        - CAR_4
        - CAR_7

    VehicleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED

    TripStatus:
      type: string
      enum:
        - DRIVER_ASSIGNED
        - DRIVER_ARRIVED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED

    IncidentStatus:
      type: string
      enum:
        - OPEN
        - INVESTIGATING
        - RESOLVED
        - CLOSED

    IncidentSeverity:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL

    # ----------------------------------------------------------
    # USERS
    # ----------------------------------------------------------

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        reason:
          type: string

    AdminUserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # ----------------------------------------------------------
    # DRIVERS
    # ----------------------------------------------------------

    AdminDriver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/DriverStatus'
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        totalTrips:
          type: integer
        createdAt:
          type: string
          format: date-time

    UpdateDriverStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DriverStatus'
        reason:
          type: string

    AdminDriverListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDriver'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # ----------------------------------------------------------
    # VEHICLES
    # ----------------------------------------------------------

    AdminVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        licensePlate:
          type: string
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        brand:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/VehicleStatus'
        createdAt:
          type: string
          format: date-time

    UpdateVehicleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/VehicleStatus'
        reason:
          type: string

    AdminVehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminVehicle'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # ----------------------------------------------------------
    # TRIPS
    # ----------------------------------------------------------

    AdminTrip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TripStatus'
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminTripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminTrip'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # ----------------------------------------------------------
    # POSITION
    # ----------------------------------------------------------

    DriverPosition:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # INCIDENT
    # ----------------------------------------------------------

    CreateIncidentRequest:
      type: object
      required:
        - type
        - severity
        - description
      properties:
        tripId:
          type: string
          format: uuid
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          example: DRIVER_BEHAVIOR
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        description:
          type: string

    UpdateIncidentRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        resolution:
