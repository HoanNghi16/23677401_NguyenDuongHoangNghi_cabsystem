services:
  trip-db:
    image: postgres:17
    container_name: cab-trip-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TRIP_DB_NAME}

    ports:
      - "5436:5432"

    volumes:
      - trip-db-data:/var/lib/postgresql/data
  notification-db:
    image: mongo:8
    container_name: cab-notification-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - notification-db-data:/data/db
  booking-db:
    image: mongo:8
    container_name: cab-booking-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - booking-db-data:/data/db

  auth-db:
    image: postgres:17
    container_name: cab-auth-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}

    ports:
      - "5434:5432"

    volumes:
      - auth-db-data:/var/lib/postgresql/data

  customer-db:
    image: postgres:17
    container_name: cab-customer-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - customer-db-data:/var/lib/postgresql/data

  driver-db:
    image: postgres:17
    container_name: cab-driver-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB_NAME}

    ports:
      - "5435:5432"

    volumes:
      - driver-db-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.0
    container_name: cab-kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cab-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: cab-system
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
volumes:
  auth-db-data:
  customer-db-data:
  driver-db-data:
  kafka-data:
  booking-db-data:
  notification-db-data:
  trip-db-data: