
services:
  # =========================
  # DATABASES
  # =========================

  auth-db:
    image: postgres:17
    container_name: cab-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-db:
    image: postgres:17
    container_name: cab-customer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CUSTOMER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-db:
    image: postgres:17
    container_name: cab-driver-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DRIVER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-db:
    image: postgres:17
    container_name: cab-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TRIP_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - trip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TRIP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:17
    container_name: cab-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PAYMENT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: mongo:8
    container_name: cab-booking-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - booking-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: mongo:8
    container_name: cab-notification-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - notification-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:4.0.0
    container_name: cab-kafka
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cab-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: cab-system
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # =========================
  # AUTH SERVICE
  # =========================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: cab-auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    ports:
      - "50051:50051"
    depends_on:
      auth-db:
        condition: service_healthy
      driver-service:
        condition: service_started

  # =========================
  # CUSTOMER SERVICE
  # =========================

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: cab-customer-service
    restart: unless-stopped
    env_file:
      - ./services/customer-service/.env
    ports:
      - "50052:50052"
    depends_on:
      customer-db:
        condition: service_healthy

  # =========================
  # DRIVER SERVICE
  # =========================

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-driver-service
    restart: unless-stopped
    env_file:
      - ./services/driver-service/.env
    ports:
      - "50053:50053"
    depends_on:
      driver-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      kafka:
        condition: service_started

  # =========================
  # BOOKING SERVICE
  # =========================

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: cab-booking-service
    restart: unless-stopped
    env_file:
      - ./services/booking-service/.env
    ports:
      - "50054:50054"
    depends_on:
      booking-db:
        condition: service_healthy
      trip-service:
        condition: service_started
      kafka:
        condition: service_started

  # =========================
  # NOTIFICATION SERVICE
  # =========================

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: cab-notification-service
    restart: unless-stopped
    env_file:
      - ./services/notification-service/.env
    ports:
      - "50055:50055"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_started

  # =========================
  # TRIP SERVICE
  # =========================

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: cab-trip-service
    restart: unless-stopped
    env_file:
      - ./services/trip-service/.env
    ports:
      - "50056:50056"
    depends_on:
      trip-db:
        condition: service_healthy
      kafka:
        condition: service_started

  # =========================
  # PAYMENT SERVICE
  # =========================

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: cab-payment-service
    restart: unless-stopped
    env_file:
      - ./services/payment-service/.env
    ports:
      - "50057:50057"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: cab-api-gateway
    restart: unless-stopped
    env_file:
      - ./services/api-gateway/.env
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      driver-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
      trip-service:
        condition: service_started
      payment-service:
        condition: service_started

# =========================
# VOLUMES
# =========================

volumes:
  auth-db-data:
  customer-db-data:
  driver-db-data:
  trip-db-data:
  payment-db-data:
  booking-db-data:
  notification-db-data:
  kafka-data:
