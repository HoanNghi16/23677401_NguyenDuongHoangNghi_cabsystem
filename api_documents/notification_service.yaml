openapi: 3.0.3

info:
  title: Notification Service API
  description: |
    Notification Service chịu trách nhiệm quản lý và gửi thông báo
    đến khách hàng, tài xế và nhân viên vận hành.

    Service này không sở hữu trạng thái nghiệp vụ của Booking hoặc Trip.
    Nó chỉ tiếp nhận yêu cầu/thông điệp từ các service khác và thực hiện
    việc phân phối thông báo thông qua các kênh phù hợp.

    Các kênh hỗ trợ:
    - PUSH
    - IN_APP
    - SMS
  version: 1.0.0

servers:
  - url: http://localhost:8009
    description: Local development server

tags:
  - name: Notifications
    description: Quản lý thông báo
  - name: Internal
    description: API nội bộ cho các service khác

paths:

  # ============================================================
  # NOTIFICATIONS
  # ============================================================

  /notifications:
    get:
      tags:
        - Notifications
      summary: Lấy danh sách thông báo
      description: |
        Lấy danh sách thông báo của người dùng hiện tại.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: isRead
          in: query
          schema:
            type: boolean
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/NotificationType'
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}:
    get:
      tags:
        - Notifications
      summary: Xem chi tiết thông báo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Thông tin thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Notifications
      summary: Đánh dấu thông báo đã đọc
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Lấy số lượng thông báo chưa đọc
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Số lượng thông báo chưa đọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # INTERNAL
  # ============================================================

  /internal/notifications:
    post:
      tags:
        - Internal
      summary: Tạo và gửi thông báo
      description: |
        API nội bộ được các service khác sử dụng để yêu cầu
        Notification Service gửi thông báo.

        Ví dụ:
        - Booking Service thông báo tài xế được phân công.
        - Booking Service thông báo không tìm được tài xế.
        - Trip Service thông báo trạng thái chuyến thay đổi.
        - Admin Service gửi thông báo vận hành nếu cần.

        Endpoint này không dành cho client trực tiếp sử dụng.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '202':
          description: Yêu cầu gửi thông báo đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDispatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/notifications/broadcast:
    post:
      tags:
        - Internal
      summary: Gửi thông báo đến nhiều người dùng
      description: |
        API nội bộ dùng để gửi một thông báo đến nhiều người dùng.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastNotificationRequest'
      responses:
        '202':
          description: Yêu cầu broadcast đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  # ============================================================
  # SECURITY
  # ============================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:

    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ============================================================
  # RESPONSES
  # ============================================================

  responses:

    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy thông báo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:

    # ----------------------------------------------------------
    # ENUMS
    # ----------------------------------------------------------

    NotificationType:
      type: string
      enum:
        - DRIVER_ASSIGNED
        - DRIVER_ACCEPTED
        - DRIVER_REJECTED
        - NO_DRIVER_AVAILABLE
        - DRIVER_ARRIVED
        - TRIP_STARTED
        - TRIP_COMPLETED
        - TRIP_CANCELLED
        - INCIDENT_CREATED
        - SYSTEM

    NotificationChannel:
      type: string
      enum:
        - PUSH
        - IN_APP
        - SMS

    NotificationPriority:
      type: string
      enum:
        - LOW
        - NORMAL
        - HIGH
        - URGENT

    NotificationStatus:
      type: string
      enum:
        - PENDING
        - SENT
        - FAILED
        - READ

    # ----------------------------------------------------------
    # NOTIFICATION
    # ----------------------------------------------------------

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid

        recipientId:
          type: string
          format: uuid

        type:
          $ref: '#/components/schemas/NotificationType'

        title:
          type: string

        message:
          type: string

        channel:
          $ref: '#/components/schemas/NotificationChannel'

        priority:
          $ref: '#/components/schemas/NotificationPriority'

        status:
          $ref: '#/components/schemas/NotificationStatus'

        referenceType:
          type: string
          nullable: true
          example: BOOKING

        referenceId:
          type: string
          format: uuid
          nullable: true

        isRead:
          type: boolean

        sentAt:
          type: string
          format: date-time
          nullable: true

        readAt:
          type: string
          format: date-time
          nullable: true

        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

        page:
          type: integer

        limit:
          type: integer

        total:
          type: integer

    # ----------------------------------------------------------
    # CREATE NOTIFICATION
    # ----------------------------------------------------------

    CreateNotificationRequest:
      type: object
      required:
        - recipientId
        - type
        - title
        - message
        - channel
      properties:

        recipientId:
          type: string
          format: uuid

        type:
          $ref: '#/components/schemas/NotificationType'

        title:
          type: string
          example: Tài xế đã được phân công

        message:
          type: string
          example: Tài xế Nguyễn Văn A đã nhận chuyến của bạn.

        channel:
          $ref: '#/components/schemas/NotificationChannel'

        priority:
          $ref: '#/components/schemas/NotificationPriority'

        referenceType:
          type: string
          nullable: true
          example: BOOKING

        referenceId:
          type: string
          format: uuid
          nullable: true

        metadata:
          type: object
          additionalProperties: true

    NotificationDispatchResponse:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid

        status:
          type: string
          enum:
            - ACCEPTED

        createdAt:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # BROADCAST
    # ----------------------------------------------------------

    BroadcastNotificationRequest:
      type: object
      required:
        - recipientIds
        - type
        - title
        - message
        - channel
      properties:

        recipientIds:
          type: array
          items:
            type: string
            format: uuid

        type:
          $ref: '#/components/schemas/NotificationType'

        title:
          type: string

        message:
          type: string

        channel:
          $ref: '#/components/schemas/NotificationChannel'

        priority:
          $ref: '#/components/schemas/NotificationPriority'

        referenceType:
          type: string
          nullable: true

        referenceId:
          type: string
          format: uuid
          nullable: true

        metadata:
          type: object
          additionalProperties: true

    BroadcastNotificationResponse:
      type: object
      properties:
        totalRecipients:
          type: integer

        accepted:
          type: integer

        createdAt:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # READ
    # ----------------------------------------------------------

    MarkReadRequest:
      type: object
      required:
        - isRead
      properties:
        isRead:
          type: boolean
          example: true

    UnreadCountResponse:
      type: object
      properties:
        unreadCount:
          type: integer
          example: 5

    # ----------------------------------------------------------
    # ERROR
    # ----------------------------------------------------------

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: NOTIFICATION_NOT_FOUND

        message:
          type: string
          example: Notification does not exist.

        details:
          type: object
          additionalProperties: true